[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-ordinal-pure"
version = "0.1.0"
description = "Zero-dependency ISO 8601 ordinal date (YYYY-DDD) parser, serializer, and converter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "iso-ordinal-pure authors"},
]
keywords = [
    "iso-8601",
    "ordinal-date",
    "iso-ordinal",
    "day-of-year",
    "YYYY-DDD",
    "date-format",
    "noaa",
    "nasa",
    "metar",
    "parser",
    "serializer",
    "calendar",
    "gregorian",
    "leap-year",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/prasad-a-abhishek/iso-ordinal-pure"
Repository = "https://github.com/prasad-a-abhishek/iso-ordinal-pure"

[project.scripts]
iso-ordinal-pure = "iso_ordinal_parse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iso_ordinal_parse = ["py.typed"]
